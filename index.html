<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Grade 10 Marangal – Term 2 Recitation</title>

  <!-- QR SCANNER -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f4f4;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: auto;
      padding: 18px;
    }

    .header {
      background: white;
      border-radius: 18px;
      padding: 22px;
      text-align: center;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .header p {
      margin: 8px 0 0;
      color: #666;
      font-size: 17px;
    }

    .scanner-card {
      background: white;
      border-radius: 18px;
      padding: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    #reader {
      width: 100%;
    }

    .status {
      text-align: center;
      padding: 13px;
      margin-top: 12px;
      border-radius: 10px;
      font-weight: bold;
      background: #fff3cd;
      color: #856404;
    }

    .status.success {
      background: #d4edda;
      color: #155724;
    }

    .status.error {
      background: #f8d7da;
      color: #721c24;
    }

    .student-card {
      display: none;
      background: white;
      margin-top: 15px;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .student-card.show {
      display: block;
    }

    .label {
      font-size: 12px;
      color: #777;
      margin-top: 10px;
    }

    .value {
      font-size: 18px;
      font-weight: bold;
      margin-top: 3px;
    }

    .point-button {
      width: 100%;
      margin-top: 20px;
      padding: 17px;
      border: none;
      border-radius: 14px;
      background: #222;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .point-button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .points {
      text-align: center;
      margin-top: 15px;
      font-size: 17px;
      font-weight: bold;
    }

    .help {
      margin-top: 15px;
      padding: 13px;
      border-radius: 10px;
      background: #fff8e1;
      color: #6d5b00;
      font-size: 14px;
      text-align: center;
    }

  </style>

</head>


<body>

<div class="container">


  <!-- HEADER -->

  <div class="header">

    <h1>
      📚 Grade 10 – Marangal
    </h1>

    <p>
      Term 2 Recitation Points
    </p>

  </div>


  <!-- QR SCANNER -->

  <div class="scanner-card">

    <div id="reader"></div>

    <div
      id="status"
      class="status"
    >
      📷 Starting QR Scanner...
    </div>

  </div>


  <!-- STUDENT INFORMATION -->

  <div
    id="studentCard"
    class="student-card"
  >

    <div class="label">
      STUDENT ID
    </div>

    <div
      id="studentId"
      class="value"
    >
      —
    </div>


    <div class="label">
      NAME
    </div>

    <div
      id="studentName"
      class="value"
    >
      —
    </div>


    <div class="label">
      SECTION
    </div>

    <div
      id="studentSection"
      class="value"
    >
      —
    </div>


    <div
      id="pointsDisplay"
      class="points"
    >
    </div>


    <!-- ADD POINT BUTTON -->

    <button
      id="pointButton"
      class="point-button"
      disabled
      onclick="addPoint()"
    >

      +1 RECITATION POINT

    </button>

  </div>


  <div class="help">

    📱 Please allow camera access when your browser asks.

    <br><br>

    Scan the student's QR code to display their information.

  </div>


</div>


<script>


/*
==================================================
GOOGLE APPS SCRIPT WEB APP
==================================================
*/

const API_URL =
  'https://script.google.com/macros/s/AKfycbwkvTyEFdtkxzmUa372TpCNbMByAc-_h89ooxydU_D68S43eEx6S15QZb7mJAwITTKZ3g/exec';


/*
==================================================
VARIABLES
==================================================
*/

let scanner = null;

let currentStudentId = '';

let currentStudent = null;

let scanningLocked = false;


/*
==================================================
STATUS
==================================================
*/

function setStatus(message, type = '') {

  const status =
    document.getElementById('status');

  status.textContent = message;

  status.className =
    'status ' + type;

}


/*
==================================================
START QR SCANNER
==================================================
*/

function startScanner() {

  scanner =
    new Html5Qrcode('reader');


  const config = {

    fps: 10,

    qrbox: {
      width: 250,
      height: 250
    },

    aspectRatio: 1.0

  };


  scanner.start(

    {
      facingMode: {
        ideal: 'environment'
      }
    },

    config,

    onScanSuccess,

    onScanFailure

  )

  .then(function() {

    setStatus(
      '📷 Ready — scan a student QR code.'
    );

  })

  .catch(function(error) {

    console.error(error);

    setStatus(
      '⚠️ Camera could not start. Please allow camera permission and reload the page.',
      'error'
    );

  });

}


/*
==================================================
QR SCAN SUCCESS
==================================================
*/

function onScanSuccess(decodedText) {

  if (scanningLocked) {
    return;
  }


  scanningLocked = true;


  const studentId =
    String(decodedText || '').trim();


  if (!studentId) {

    scanningLocked = false;

    return;

  }


  setStatus(
    '🔎 Reading student information...'
  );


  /*
   * Pause scanner while looking up student
   */

  try {

    if (scanner) {
      scanner.pause(true);
    }

  } catch (error) {

    console.log(error);

  }


  lookupStudent(studentId);

}


/*
==================================================
QR SCAN FAILURE
==================================================
*/

function onScanFailure(error) {

  /*
   * Nothing needed here.
   *
   * The scanner continuously checks the camera.
   */

}


/*
==================================================
LOOK UP STUDENT
==================================================
*/

function lookupStudent(studentId) {


  const callbackName =
    'studentLookup_' +
    Date.now();


  window[callbackName] =
    function(data) {

      try {


        /*
         * ERROR
         */

        if (!data || !data.success) {

          showError(
            data && data.error
              ? data.error
              : 'Student ID not found.'
          );

          return;

        }


        /*
         * SAVE STUDENT
         */

        currentStudentId =
          data.studentId;

        currentStudent =
          data;


        /*
         * DISPLAY STUDENT ID
         */

        document.getElementById(
          'studentId'
        ).textContent =
          data.studentId;


        /*
         * DISPLAY NAME
         */

        document.getElementById(
          'studentName'
        ).textContent =
          data.studentName;


        /*
         * DISPLAY SECTION
         */

        document.getElementById(
          'studentSection'
        ).textContent =
          data.section;


        /*
         * DISPLAY CARD
         */

        document.getElementById(
          'studentCard'
        ).classList.add('show');


        /*
         * ENABLE BUTTON
         */

        const button =
          document.getElementById(
            'pointButton'
          );

        button.disabled = false;

        button.textContent =
          '+1 RECITATION POINT';


        /*
         * STATUS
         */

        setStatus(
          '✅ Student verified. Ready to record.',
          'success'
        );


      }

      finally {

        delete window[callbackName];

      }

    };


  /*
   * CREATE SCRIPT REQUEST
   */

  const script =
    document.createElement('script');


  script.src =
    API_URL +
    '?action=lookup' +
    '&studentId=' +
    encodeURIComponent(studentId) +
    '&callback=' +
    callbackName;


  script.onerror =
    function() {

      delete window[callbackName];

      showError(
        'Could not connect to Google Sheets.'
      );

    };


  document.body.appendChild(script);

}


/*
==================================================
ADD RECITATION POINT
==================================================
*/

function addPoint() {


  if (!currentStudentId) {

    return;

  }


  const button =
    document.getElementById(
      'pointButton'
    );


  /*
   * Prevent double clicking
   */

  button.disabled = true;

  button.textContent =
    'ADDING POINT...';


  setStatus(
    '⏳ Recording recitation point...'
  );


  const callbackName =
    'addPoint_' +
    Date.now();


  window[callbackName] =
    function(data) {

      try {


        /*
         * ERROR
         */

        if (!data || !data.success) {

          showError(
            data && data.error
              ? data.error
              : 'Could not add point.'
          );

          button.disabled = false;

          button.textContent =
            '+1 RECITATION POINT';

          return;

        }


        /*
         * SUCCESS
         */

        setStatus(
          '🎉 +1 Recitation Point recorded!',
          'success'
        );


        /*
         * SHOW NEW POINT TOTAL
         */

        document.getElementById(
          'pointsDisplay'
        ).textContent =
          'Term 2 Points: ' +
          data.points;


        /*
         * CHANGE BUTTON
         */

        button.textContent =
          '✓ POINT ADDED';


        /*
         * Prepare for next student
         */

        setTimeout(
          resetScanner,
          1800
        );


      }

      finally {

        delete window[callbackName];

      }

    };


  /*
   * CREATE ADD POINT REQUEST
   */

  const script =
    document.createElement('script');


  script.src =
    API_URL +
    '?action=addPoint' +
    '&studentId=' +
    encodeURIComponent(
      currentStudentId
    ) +
    '&callback=' +
    callbackName;


  script.onerror =
    function() {

      delete window[callbackName];


      showError(
        'Could not connect to Google Sheets.'
      );


      button.disabled = false;

      button.textContent =
        '+1 RECITATION POINT';

    };


  document.body.appendChild(script);

}


/*
==================================================
SHOW ERROR
==================================================
*/

function showError(message) {


  setStatus(
    '⚠️ ' + message,
    'error'
  );


  const button =
    document.getElementById(
      'pointButton'
    );


  button.disabled = true;

  button.textContent =
    '+1 RECITATION POINT';


  setTimeout(
    resetScanner,
    2000
  );

}


/*
==================================================
RESET FOR NEXT STUDENT
==================================================
*/

function resetScanner() {


  currentStudentId = '';

  currentStudent = null;

  scanningLocked = false;


  /*
   * Hide student card
   */

  document.getElementById(
    'studentCard'
  ).classList.remove('show');


  /*
   * Clear information
   */

  document.getElementById(
    'studentId'
  ).textContent = '—';


  document.getElementById(
    'studentName'
  ).textContent = '—';


  document.getElementById(
    'studentSection'
  ).textContent = '—';


  document.getElementById(
    'pointsDisplay'
  ).textContent = '';


  /*
   * Reset button
   */

  const button =
    document.getElementById(
      'pointButton'
    );


  button.disabled = true;

  button.textContent =
    '+1 RECITATION POINT';


  /*
   * Status
   */

  setStatus(
    '📷 Ready — scan the next student.'
  );


  /*
   * Resume camera
   */

  try {

    if (scanner) {

      scanner.resume();

    }

  }

  catch (error) {

    console.log(error);

  }

}


/*
==================================================
START WHEN PAGE LOADS
==================================================
*/

window.addEventListener(
  'load',
  function() {

    startScanner();

  }
);

</script>

</body>

</html>
