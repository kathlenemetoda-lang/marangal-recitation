<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Grade 10 – Marangal Term 2 Recitation</title>

<script src="https://unpkg.com/html5-qrcode"
        type="text/javascript">
</script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f3f3;
    color: #111;
}

.container {
    width: 100%;
    max-width: 970px;
    margin: auto;
}

/* HEADER */

.header {
    background: white;
    border-radius: 28px;
    padding: 42px 25px;
    text-align: center;
    box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    margin-bottom: 30px;
}

.header h1 {
    margin: 0;
    font-size: 42px;
}

.header h2 {
    margin: 15px 0 0;
    font-size: 32px;
    font-weight: 400;
    color: #666;
}

/* CARD */

.card {
    background: white;
    border-radius: 28px;
    padding: 30px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    margin-bottom: 25px;
}

/* CAMERA */

#reader {
    width: 100%;
    max-width: 650px;
    margin: auto;
}

/* STATUS */

.status {
    display: block;
    padding: 22px;
    border-radius: 18px;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 20px;
}

.status.error {
    background: #f8d7da;
    color: #842029;
}

.status.success {
    background: #d1e7dd;
    color: #0f5132;
}

.status.info {
    background: #fff3cd;
    color: #664d03;
}

/* STUDENT */

.student {
    display: none;
}

.student.show {
    display: block;
}

.student-box {
    background: #f8f9fa;
    border-radius: 20px;
    padding: 25px;
    margin-bottom: 20px;
}

.label {
    font-size: 15px;
    color: #777;
    margin-top: 10px;
}

.value {
    font-size: 26px;
    font-weight: bold;
    margin-top: 4px;
    word-break: break-word;
}

/* BUTTON */

button {
    width: 100%;
    border: none;
    border-radius: 18px;
    padding: 22px;
    font-size: 23px;
    font-weight: bold;
    cursor: pointer;
    background: #198754;
    color: white;
}

button:disabled {
    background: #999;
    cursor: not-allowed;
}

.reset {
    background: #555;
    margin-top: 12px;
}

/* MOBILE */

@media (max-width: 600px) {

    body {
        padding: 10px;
    }

    .header {
        padding: 30px 15px;
    }

    .header h1 {
        font-size: 30px;
    }

    .header h2 {
        font-size: 23px;
    }

    .card {
        padding: 18px;
    }

    .value {
        font-size: 21px;
    }

    button {
        font-size: 20px;
    }

}

</style>

</head>


<body>


<div class="container">


    <!-- HEADER -->

    <div class="header">

        <h1>
            📚 Grade 10 – Marangal
        </h1>

        <h2>
            Term 2 Recitation Points
        </h2>

    </div>



    <!-- CAMERA -->

    <div class="card">

        <div id="status"
             class="status info">

            📷 Starting camera...

        </div>

        <div id="reader"></div>

    </div>



    <!-- STUDENT INFORMATION -->

    <div id="studentCard"
         class="card student">

        <div class="student-box">

            <div class="label">
                STUDENT ID
            </div>

            <div id="studentId"
                 class="value">
            </div>


            <div class="label">
                NAME
            </div>

            <div id="studentName"
                 class="value">
            </div>


            <div class="label">
                SECTION
            </div>

            <div id="section"
                 class="value">
            </div>


            <div class="label">
                TERM 2 RECITATION POINTS
            </div>

            <div id="points"
                 class="value">
                —
            </div>

        </div>


        <button id="addButton"
                onclick="addPoint()">

            ➕ +1 RECITATION POINT

        </button>


        <button class="reset"
                onclick="resetScanner()">

            🔄 SCAN ANOTHER STUDENT

        </button>

    </div>


</div>



<script>


/* =========================================================
   GOOGLE APPS SCRIPT API
   ========================================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbwkvTyEFdtkxzmUa372TpCNbMByAc-_h89ooxydU_D68S43eEx6S15QZb7mJAwITTKZ3g/exec";


/* =========================================================
   VARIABLES
   ========================================================= */

let scanner = null;

let currentStudent = null;

let scanningLocked = false;


/* =========================================================
   STATUS MESSAGE
   ========================================================= */

function showStatus(message, type) {

    const status =
        document.getElementById("status");

    status.textContent = message;

    status.className =
        "status " + type;

}


/* =========================================================
   API REQUEST
   ========================================================= */

function apiRequest(action, studentId, callback) {

    const callbackName =
        "apiCallback_" +
        Date.now() +
        "_" +
        Math.floor(Math.random() * 100000);


    const script =
        document.createElement("script");


    const timeout =
        setTimeout(function() {

            cleanup();

            callback({

                success: false,

                error:
                    "The server took too long to respond."

            });

        }, 15000);


    function cleanup() {

        clearTimeout(timeout);

        delete window[callbackName];

        if (script.parentNode) {

            script.parentNode.removeChild(script);

        }

    }


    window[callbackName] =
        function(result) {

            cleanup();

            callback(result);

        };


    script.onerror =
        function() {

            cleanup();

            callback({

                success: false,

                error:
                    "Could not connect to the Google Sheet server."

            });

        };


    script.src =
        API_URL +
        "?action=" +
        encodeURIComponent(action) +
        "&studentId=" +
        encodeURIComponent(studentId) +
        "&callback=" +
        encodeURIComponent(callbackName) +
        "&t=" +
        Date.now();


    document.body.appendChild(script);

}


/* =========================================================
   EXTRACT STUDENT ID FROM QR CODE
   =========================================================
   
   This accepts BOTH:

   MARANGAL-002

   AND:

   https://example.com/?id=MARANGAL-002

   ========================================================= */

function extractStudentId(qrText) {

    let studentId =
        String(qrText || "").trim();


    /* -----------------------------------------
       CASE 1:
       QR contains a URL
       ----------------------------------------- */

    if (
        studentId.startsWith("http://") ||
        studentId.startsWith("https://")
    ) {

        try {

            const qrUrl =
                new URL(studentId);


            /* Look for ?id=MARANGAL-002 */

            const idParameter =
                qrUrl.searchParams.get("id");


            if (idParameter) {

                studentId =
                    idParameter.trim();

            }


            /* If there is no ?id=,
               try the last part of the URL */

            else {

                const parts =
                    qrUrl.pathname
                        .split("/")
                        .filter(Boolean);


                if (parts.length > 0) {

                    studentId =
                        parts[parts.length - 1]
                            .trim();

                }

            }

        }

        catch (error) {

            console.log(
                "Could not read QR URL."
            );

        }

    }


    /* -----------------------------------------
       CLEAN COMMON EXTRA CHARACTERS
       ----------------------------------------- */

    studentId =
        studentId
            .replace(/^id=/i, "")
            .trim();


    return studentId;

}


/* =========================================================
   LOOKUP STUDENT
   ========================================================= */

function lookupStudent(qrText) {


    /* -----------------------------------------
       EXTRACT ACTUAL STUDENT ID
       ----------------------------------------- */

    const studentId =
        extractStudentId(qrText);


    console.log(
        "QR scanned:",
        qrText
    );


    console.log(
        "Student ID extracted:",
        studentId
    );


    if (!studentId) {

        showStatus(
            "❌ No student ID was found in the QR code.",
            "error"
        );

        scanningLocked = false;

        return;

    }


    showStatus(
        "🔎 Looking up " +
        studentId +
        "...",
        "info"
    );


    apiRequest(

        "lookup",

        studentId,

        function(result) {


            if (!result.success) {

                showStatus(
                    "❌ " +
                    result.error,
                    "error"
                );

                scanningLocked = false;

                return;

            }


            /* -----------------------------------------
               SAVE STUDENT
               ----------------------------------------- */

            currentStudent =
                result;


            /* -----------------------------------------
               DISPLAY INFORMATION
               ----------------------------------------- */

            document.getElementById(
                "studentId"
            ).textContent =
                result.studentId;


            document.getElementById(
                "studentName"
            ).textContent =
                result.studentName;


            document.getElementById(
                "section"
            ).textContent =
                result.section;


            document.getElementById(
                "points"
            ).textContent =
                "Ready to add";


            document.getElementById(
                "studentCard"
            ).classList.add("show");


            /* -----------------------------------------
               SUCCESS
               ----------------------------------------- */

            showStatus(
                "✅ Student found!",
                "success"
            );

        }

    );

}


/* =========================================================
   ADD RECITATION POINT
   ========================================================= */

function addPoint() {


    if (!currentStudent) {

        return;

    }


    const button =
        document.getElementById(
            "addButton"
        );


    button.disabled = true;

    button.textContent =
        "⏳ Adding point...";


    showStatus(
        "⏳ Saving recitation point...",
        "info"
    );


    apiRequest(

        "addPoint",

        currentStudent.studentId,

        function(result) {


            if (!result.success) {

                button.disabled =
                    false;

                button.textContent =
                    "➕ +1 RECITATION POINT";


                showStatus(
                    "❌ " +
                    result.error,
                    "error"
                );

                return;

            }


            /* -----------------------------------------
               UPDATE DISPLAYED POINTS
               ----------------------------------------- */

            currentStudent =
                result;


            document.getElementById(
                "points"
            ).textContent =
                result.points;


            /* -----------------------------------------
               BUTTON
               ----------------------------------------- */

            button.disabled = true;

            button.textContent =
                "✅ POINT ADDED";


            /* -----------------------------------------
               SUCCESS
               ----------------------------------------- */

            showStatus(

                "✅ 1 recitation point added for " +
                result.studentName +
                "!",

                "success"

            );

        }

    );

}


/* =========================================================
   START CAMERA
   ========================================================= */

async function startScanner() {


    showStatus(
        "📷 Starting camera...",
        "info"
    );


    try {


        /* -----------------------------------------
           CHECK HTTPS
           ----------------------------------------- */

        if (!window.isSecureContext) {

            throw new Error(
                "Camera requires a secure HTTPS connection."
            );

        }


        /* -----------------------------------------
           CHECK CAMERA SUPPORT
           ----------------------------------------- */

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            throw new Error(
                "This browser does not support camera access."
            );

        }


        /* -----------------------------------------
           CREATE SCANNER
           ----------------------------------------- */

        scanner =
            new Html5Qrcode(
                "reader"
            );


        const config = {

            fps: 10,

            qrbox: {
                width: 280,
                height: 280
            },

            aspectRatio: 1.0

        };


        /* -----------------------------------------
           START REAR CAMERA
           ----------------------------------------- */

        await scanner.start(

            {
                facingMode: "environment"
            },

            config,


            /* -----------------------------------------
               QR SUCCESS
               ----------------------------------------- */

            function(decodedText) {


                if (scanningLocked) {

                    return;

                }


                scanningLocked =
                    true;


                lookupStudent(
                    decodedText
                );

            },


            /* -----------------------------------------
               QR SCANNING ERRORS
               ----------------------------------------- */

            function(errorMessage) {

                /*
                   Normal scanning messages
                   are intentionally ignored.
                */

            }

        );


        showStatus(
            "📷 Camera ready — scan the student's QR code.",
            "info"
        );


    }


    catch (error) {


        console.error(
            "Camera error:",
            error
        );


        let message =
            "⚠️ Camera could not start.";


        if (
            error &&
            error.message
        ) {

            message +=
                " " +
                error.message;

        }


        message +=
            " Please allow camera access and reload the page.";


        showStatus(
            message,
            "error"
        );

    }

}


/* =========================================================
   RESET FOR NEXT STUDENT
   ========================================================= */

async function resetScanner() {


    currentStudent =
        null;


    scanningLocked =
        false;


    document.getElementById(
        "studentCard"
    ).classList.remove("show");


    const button =
        document.getElementById(
            "addButton"
        );


    button.disabled =
        false;


    button.textContent =
        "➕ +1 RECITATION POINT";


    showStatus(
        "📷 Scan another student's QR code.",
        "info"
    );

}


/* =========================================================
   START EVERYTHING
   ========================================================= */

window.addEventListener(
    "load",
    function() {

        setTimeout(
            startScanner,
            500
        );

    }
);

</script>


</body>

</html>
